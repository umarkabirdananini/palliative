<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shagon Sauki Na Amadun Alu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #receiptSection, #receiptSection * {
        visibility: visible;
      }
      #receiptSection {
        position: absolute;
        left: 0;
        top: 0;
        width: 58mm;
        font-size: 12px;
      }
    }
  </style>
</head>
<body class="bg-light">

<div class="container py-5">
  <h2 class="mb-4 text-center">Shagon Sauki Na Amadun Alu</h2>

  <!-- Agent Info -->
  <div class="card mb-3">
    <div class="card-body">
      <label for="agentName" class="form-label">Agent Name</label>
      <input type="text" id="agentName" class="form-control" placeholder="Enter agent name" />
    </div>
  </div>

  <!-- Beneficiary Search -->
  <div class="card mb-4">
    <div class="card-body">
      <label for="computerNumber" class="form-label">Enter Beneficiary Computer Number</label>
      <input type="text" id="computerNumber" class="form-control mb-2" placeholder="e.g. 123456" />
      <button class="btn btn-primary" onclick="fetchBeneficiary()">Fetch Details</button>
    </div>
  </div>

  <!-- Beneficiary Info -->
  <div class="card mb-4 d-none" id="beneficiaryCard">
    <div class="card-body">
      <h5>Beneficiary Info</h5>
      <p><strong>Name:</strong> <span id="benName"></span></p>
      <p><strong>Salary:</strong> ₦<span id="benSalary"></span></p>
      <p><strong>Loan Eligible:</strong> <span id="loanStatus"></span></p>
      <p><strong>Purchase Mode:</strong>
        <select class="form-select" id="purchaseMode" onchange="resetCart()">
          <option value="spot">Paying at Spot</option>
          <option value="loan">Taking on Loan</option>
        </select>
      </p>
    </div>
  </div>

  <!-- Cart & Product List -->
  <div class="card mb-4 d-none" id="productSection">
    <div class="card-body">
      <h5>Add Items</h5>
      <div class="row g-2">
        <div class="col-md-4">
          <select class="form-select" id="productSelect">
            <option value="50kg">Rice 50kg - ₦50,000</option>
            <option value="25kg">Rice 25kg - ₦25,000</option>
            <option value="10kg">Rice 10kg - ₦12,500</option>
            <option value="5kg">Rice 5kg - ₦6,250</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="number" min="1" value="1" id="productQty" class="form-control" />
        </div>
        <div class="col-md-3">
          <button class="btn btn-success" onclick="addToCart()">Add to Cart</button>
        </div>
      </div>

      <!-- Cart Display -->
      <div class="mt-4">
        <h6>Cart</h6>
        <ul class="list-group" id="cartList"></ul>
        <p class="mt-3"><strong>Total:</strong> ₦<span id="cartTotal">0</span></p>
        <button class="btn btn-primary mt-2" onclick="buyNow()">Buy Now</button>
      </div>
    </div>
  </div>

  <!-- Receipt Section -->
  <div class="container d-none" id="receiptSection">
    <div class="card mt-4">
      <div class="card-body">
        <h5 class="text-center mb-3">Purchase Receipt</h5>
        <div id="receiptContent" style="font-family: monospace; white-space: pre-line;">
          <!-- Receipt content inserted here -->
        </div>
        <div class="text-center mt-3">
          <button class="btn btn-secondary" onclick="window.print()">🖨️ Print Receipt</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- JavaScript Logic -->
<script>
  let beneficiary = {};
  let cart = [];
  const productPrices = {
    "50kg": 50000,
    "25kg": 25000,
    "10kg": 12500,
    "5kg": 6250
  };

  function fetchBeneficiary() {
    const computerNumber = document.getElementById('computerNumber').value;
    if (!computerNumber.trim()) {
      alert("Enter a valid computer number.");
      return;
    }

    // Simulate Laravel AJAX response
    beneficiary = {
      name: "Abubakar Musa",
      salary: 120000,
      loanEligible: true
    };

    document.getElementById('benName').innerText = beneficiary.name;
    document.getElementById('benSalary').innerText = beneficiary.salary.toLocaleString();
    document.getElementById('loanStatus').innerText = beneficiary.loanEligible ? "Yes" : "No";

    document.getElementById('beneficiaryCard').classList.remove('d-none');
    document.getElementById('productSection').classList.remove('d-none');
    resetCart();
  }

  function resetCart() {
    cart = [];
    updateCart();
    document.getElementById('cartTotal').innerText = '0';
    document.getElementById('cartList').innerHTML = '';
  }

  function addToCart() {
    const mode = document.getElementById('purchaseMode').value;
    const selected = document.getElementById('productSelect').value;
    const quantity = parseInt(document.getElementById('productQty').value);
    const price = productPrices[selected];
    const totalToAdd = price * quantity;
    const currentTotal = getCartTotal();

    if (mode === 'loan' && totalToAdd + currentTotal > (beneficiary.salary / 3)) {
      alert("Loan limit exceeded: Max is 1/3 of salary.");
      return;
    }

    if (mode === 'spot' && totalToAdd + currentTotal > 20000) {
      alert("Spot payment limit exceeded: Max ₦20,000/week.");
      return;
    }

    cart.push({ item: selected, qty: quantity, price });
    updateCart();
  }

  function getCartTotal() {
    return cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  }

  function updateCart() {
    const cartList = document.getElementById('cartList');
    cartList.innerHTML = '';
    cart.forEach((item, i) => {
      cartList.innerHTML += `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          ${item.qty} × ${item.item} @ ₦${item.price.toLocaleString()}
          <button class="btn btn-sm btn-danger" onclick="removeItem(${i})">Remove</button>
        </li>`;
    });
    document.getElementById('cartTotal').innerText = getCartTotal().toLocaleString();
  }

  function removeItem(index) {
    cart.splice(index, 1);
    updateCart();
  }

  function buyNow() {
    if (cart.length === 0) {
      alert("Cart is empty.");
      return;
    }

    const agentName = document.getElementById('agentName').value;
    if (!agentName.trim()) {
      alert("Enter agent name.");
      return;
    }

    const mode = document.getElementById('purchaseMode').value;
    const total = getCartTotal();
    const now = new Date();
    const items = cart.map(item =>
      `${item.qty} x ${item.item.padEnd(8)} ₦${(item.qty * item.price).toLocaleString()}`
    ).join('\n');

    const receipt = `
SHAGON SAUKI NA AMADUN ALU
Sokoto North - Shop Location
------------------------------
Agent: ${agentName}
Date: ${now.toLocaleDateString()} ${now.toLocaleTimeString()}
Customer: ${beneficiary.name}
Salary: ₦${beneficiary.salary.toLocaleString()}
Mode: ${mode.toUpperCase()}
------------------------------
ITEMS
${items}
------------------------------
TOTAL: ₦${total.toLocaleString()}
------------------------------
Thank you for your patronage!
    `.trim();

    document.getElementById("receiptContent").innerText = receipt;
    document.getElementById("receiptSection").classList.remove('d-none');
    resetCart();
  }
</script>
</body>
</html>
