<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shagon Sauki – A Palliative Shop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(120deg, #007f5f, #2b9348, #55a630);
      color: white;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 8vw;
      letter-spacing: 1px;
      animation: fadeInDown 1s ease forwards;
    }

    h2 {
      font-size: 4vw;
      margin-top: 10px;
      animation: fadeInUp 1.2s ease forwards;
    }

    .icons {
      display: flex;
      gap: 20px;
      font-size: 10vw;
      margin: 30px 0;
      animation: floatIcons 3s infinite ease-in-out;
    }

    .coming {
      font-size: 6vw;
      font-weight: bold;
      opacity: 0;
      animation: fadeInZoom 1.2s ease 3s forwards;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatIcons {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @keyframes fadeInZoom {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.9rem;
      color: #e0ffe0;
      opacity: 0.6;
    }

    @media (min-width: 768px) {
      h1 { font-size: 4rem; }
      h2 { font-size: 2rem; }
      .icons { font-size: 4rem; }
      .coming { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Shagon Sauki</h1>
    <h2>Affordable Essentials for Every Civil Servant</h2>

    <div class="icons">
      <span>🍚</span>
      <span>🛢️</span>
      <span>🌾</span>
      <span>🥖</span>
      <span>🧴</span>
    </div>

    <div class="coming">Coming Soon!</div>
  </div>

  <footer>© 2025 Sokoto State Government – Subsidized Palliative Distribution</footer>

</body>
</html>
